apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: togglemaster
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: 905418203619.dkr.ecr.sa-east-1.amazonaws.com/auth-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          protocol: TCP
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              key: AUTH_DB_HOST
              name: app-config
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              key: AUTH_DB_PORT
              name: app-config
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              key: AUTH_DB_NAME
              name: app-config
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: db-auth-credentials
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              key: AWS_REGION
              name: app-config
        - name: AWS_SQS_URL
          valueFrom:
            configMapKeyRef:
              key: AWS_SQS_URL
              name: app-config
        - name: AWS_DYNAMODB_TABLE
          valueFrom:
            configMapKeyRef:
              key: AWS_DYNAMODB_TABLE
              name: app-config
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
