name: CI/CD - auth-service

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'auth-service/**'
  push:
    branches: [ main ]
    paths:
      - 'auth-service/**'

env:
  AWS_REGION: sa-east-1
  ECR_REPOSITORY: togglemaster/auth
  SERVICE_NAME: auth-service

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Run Unit Tests
        run: go test -v ./... || echo "Nenhum teste encontrado ainda"

  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: auth-service
          args: --timeout=5m

  security-scan:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run gosec (SAST)
        uses: securego/gosec@master
        with:
          args: '-severity high -confidence high ./...'

      - name: Run govulncheck (SCA)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker-build-scan-push:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [lint, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha_short }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha_short }}'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Push image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha_short }}

      - name: Update GitOps repository
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          git config --global user.email "ci-bot@togglemaster.com"
          git config --global user.name "CI Bot"
          git clone https://x-access-token:${GITOPS_PAT}@github.com/luisfelipems/togglemaster-gitops.git
          cd togglemaster-gitops
          sed -i "s|image: .*${{ env.ECR_REPOSITORY }}:.*|image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha_short }}|g" apps/auth/deployment.yaml
          git add apps/auth/deployment.yaml
          git commit -m "chore: atualiza imagem de auth-service para ${{ steps.vars.outputs.sha_short }}" || echo "Nenhuma mudanca para commitar"
          git push origin main